<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment_09 Case_01</title>
    <link rel="stylesheet" href="../assets/lib/normalize.css">
    <style>
        body{
            background-color: #2b2b2b;
        }
        h1{
            color: white;
        }
        section{
            position: relative;
            width: 500px;
            height: 1000px;
            margin-right: auto;
            margin-left: auto;
            top: 200px;
        }
        .box{
            width: 100px;
            height: 50px;
            margin: 10px;
        }
        #centerBoxes{
            display: flex;
            flex-direction: row;
        }
        #first{
            background-color: red;
        }
        #second{
            background-color: green;
        }
        #third{
            background-color: blue;
        }
        #fourth{
            background-color: yellow;
        }
        #fifth{
            background-color: mediumpurple;
        }
        #last{
            position: absolute;
            right: 0;
            background-color: deeppink;
        }
    </style>
</head>
<body>
    <section>
        <div id="first" class="box"></div>
        <h1>_______________________________</h1>
        <div id="centerBoxes">
            <div id="second" class="box"></div>
            <div id="third" class="box"></div>
            <div id="fourth" class="box"></div>
            <div id="fifth" class="box"></div>
        </div>
        <h1>_______________________________</h1>
        <div id="last" class="box"></div>
    </section>
    <script>
        let colours = ["red", "green", "blue", "yellow", "mediumpurple", "deeppink"];

        setInterval(() => {
            let first = colours.pop();
            colours.unshift(first);
            document.getElementById("first").style.backgroundColor = colours[0];
            document.getElementById("second").style.backgroundColor = colours[1];
            document.getElementById("third").style.backgroundColor = colours[2];
            document.getElementById("fourth").style.backgroundColor = colours[3];
            document.getElementById("fifth").style.backgroundColor = colours[4];
            document.getElementById("last").style.backgroundColor = colours[5];
        }, 1000);
    </script>
</body>
</html>
